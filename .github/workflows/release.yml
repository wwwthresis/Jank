name: Release

# Push a tag to publish a GitHub release with the Linux build:
#   git tag v0.2.0-alpha.31035 && git push origin v0.2.0-alpha.31035
# The tag must be v<version>[-<channel>] as in app/Cargo.toml and app/src/appinfo.rs,
# optionally followed by the build number from app/BUILD_NUMBER (".31035", "+31035" or "-build31035").
# "Run workflow" by hand builds the same files as an artifact without publishing anything.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04   # older glibc: the program also runs on older distributions
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev file
      - name: Engine tests
        run: cargo test --release --locked
        working-directory: core
      - name: appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Package
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: tools/package_release.sh
      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          FULL=$(cut -d+ -f1 dist/VERSION)
          BUILD=$(cut -d+ -f2 dist/VERSION)
          case "$GITHUB_REF_NAME" in
            "v$FULL"|"v$FULL.$BUILD"|"v$FULL+$BUILD"|"v$FULL-build$BUILD") ;;
            *) echo "::error::tag $GITHUB_REF_NAME does not match version $FULL (build $BUILD)"; exit 1 ;;
          esac
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FULL=$(cut -d+ -f1 dist/VERSION)
          BUILD=$(cut -d+ -f2 dist/VERSION)
          PRE=--prerelease
          case "$FULL" in *-*) ;; *) PRE= ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.AppImage dist/SHA256SUMS \
            --title "Jank! $FULL (build $BUILD)" --notes-file dist/NOTES.md $PRE
      - name: Keep the files (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: jank-linux-x86_64
          path: dist/
