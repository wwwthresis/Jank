[package]
name = "jank"
version = "0.2.0"
edition = "2021"
description = "Jank! - a low-poly / PSX model studio: modeling, textures, posing, frame-by-frame animation and video/photo output"

[dependencies]
psxcore = { path = "../core" }
# Version is pinned: our code targets the 0.31 API. Every version-sensitive call lives in src/compat.rs.
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[profile.dev]
opt-level = 1
[profile.dev.package.psxcore]
# the software rasterizer is too slow without optimizations
opt-level = 3
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
